<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Veterinaria de Guatemala - Recibo de Caja (80mm / 72mm)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* Estilos Específicos para Térmica de 80mm / 72mm Útil */
    :root {
      --agricovet-navy: #0c1b47;
    }

    .recibo-ticket-container {
      width: 72mm;
      min-width: 72mm;
      max-width: 72mm;
      margin: 0 auto;
      padding: 2mm 1.5mm;
      background: #ffffff;
      color: #000000;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
      font-size: 11px;
      line-height: 1.25;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .recibo-header {
      text-align: center;
      border-bottom: 2px dashed #0c1b47;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .recibo-company-title {
      color: #0c1b47;
      font-weight: 900;
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recibo-tag {
      display: inline-block;
      background-color: #0c1b47;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
      margin-top: 4px;
    }

    .recibo-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 10px;
    }

    .recibo-table th {
      background-color: #0c1b47;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 9px;
      padding: 4px 2px;
      text-align: left;
    }

    .recibo-table td {
      padding: 4px 2px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    /* SECCIÓN EXCLUSIVA INVERTIDA PARA PAGO EN EFECTIVO */
    .recibo-cash-section {
      background-color: #0c1b47 !important;
      color: #ffffff !important;
      border: 2px solid #0c1b47;
      border-radius: 6px;
      padding: 8px;
      margin: 10px 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .recibo-cash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .recibo-signature-space {
      margin: 20px auto 6px auto;
      width: 80%;
      border-bottom: 1px solid #000000;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-receipt, #printable-receipt * {
        visibility: visible;
      }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 72mm !important;
        box-shadow: none !important;
      }
      @page {
        size: 80mm auto;
        margin: 0mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="app"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const ReciboCajaApp = () => {
      const ticketRef = useRef(null);

      const [recibo, setRecibo] = useState({
        empresaNombre: 'AGRÍCOLA VETERINARIA DE GUATEMALA',
        empresaSubtítulo: 'AGRICOVET - PETÉN',
        direccion: 'Segunda Lotificación, Santa Elena, Petén',
        telefono: '7755-2445 / Celular: 3645-0241',
        folio: 'P Nº 000151',
        fecha: new Date().toLocaleDateString('es-GT') + ' 14:30',
        clienteNombre: 'Finca Ganadera La Bendición',
        clienteNit: '7482910-K',
        clienteCodigo: 'CLI-8042',
        concepto: 'Pago de productos veterinarios e insumos agrícolas',
        items: [
          { id: 1, cantidad: 2, descripcion: 'Ivermectina 1% 500ml (Desparasitante)', precioUnitario: 185.00 },
          { id: 2, cantidad: 5, descripcion: 'Saco Alimento Ganado Lechero 40kg', precioUnitario: 210.00 },
          { id: 3, cantidad: 10, descripcion: 'Jeringa Veterinaria Desechable 20ml', precioUnitario: 6.50 },
          { id: 4, cantidad: 1, descripcion: 'Vitamina AD3E Inyectable 250ml', precioUnitario: 145.00 }
        ],
        efectivoRecibido: 1700.00,
        cajeroNombre: 'Juan Carlos Pérez',
        observaciones: 'Pago recibido conforme en efectivo.'
      });

      const totalPagar = recibo.items.reduce((sum, i) => sum + (i.cantidad * i.precioUnitario), 0);
      const cambioEfectivo = Math.max(0, recibo.efectivoRecibido - totalPagar);
      const esSaldoFaltante = recibo.efectivoRecibido < totalPagar;

      const updateField = (field, val) => setRecibo(prev => ({ ...prev, [field]: val }));

      const updateItem = (id, field, val) => {
        setRecibo(prev => ({
          ...prev,
          items: prev.items.map(item => item.id === id ? { ...item, [field]: val } : item)
        }));
      };

      const addItem = () => {
        setRecibo(prev => ({
          ...prev,
          items: [...prev.items, { id: Date.now(), cantidad: 1, descripcion: 'Nuevo Insumo', precioUnitario: 50 }]
        }));
      };

      const removeItem = (id) => {
        setRecibo(prev => ({ ...prev, items: prev.items.filter(i => i.id !== id) }));
      };

      const handlePrint = () => window.print();

      const handleDownloadPDF = () => {
        const element = ticketRef.current;
        const opt = {
          margin: [2, 2, 2, 2],
          filename: `Recibo_Agricovet_${recibo.folio.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 3, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: [80, 200], orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
          {/* BARRA SUPERIOR */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-[#0c1b47] text-white rounded-xl shadow-md font-bold text-xl">
                🧾
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-[#0c1b47]">
                  Recibo de Caja Agricovet
                </h1>
                <p className="text-xs sm:text-sm text-slate-500">
                  Formato Térmico (80mm Ancho / 72mm Útil) - Fondo Invertido en Efectivo #0c1b47
                </p>
              </div>
            </div>

            <div className="flex gap-2">
              <button onClick={handlePrint} className="px-4 py-2 bg-[#0c1b47] text-white font-bold rounded-lg shadow hover:bg-[#162a66]">
                🖨️ Imprimir Ticket (80mm)
              </button>
              <button onClick={handleDownloadPDF} className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-lg shadow hover:bg-emerald-700">
                📥 Descargar PDF
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* FORMULARIO */}
            <div className="lg:col-span-7 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
              <h2 className="text-lg font-bold text-[#0c1b47] border-b pb-2">✏️ Formulario de Llenado</h2>
              
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold">Folio Recibo</label>
                  <input type="text" value={recibo.folio} onChange={e => updateField('folio', e.target.value)} className="w-full border p-2 rounded text-sm font-bold text-red-600" />
                </div>
                <div>
                  <label className="text-xs font-semibold">Fecha</label>
                  <input type="text" value={recibo.fecha} onChange={e => updateField('fecha', e.target.value)} className="w-full border p-2 rounded text-sm" />
                </div>
                <div>
                  <label className="text-xs font-semibold">Cliente</label>
                  <input type="text" value={recibo.clienteNombre} onChange={e => updateField('clienteNombre', e.target.value)} className="w-full border p-2 rounded text-sm font-medium" />
                </div>
                <div>
                  <label className="text-xs font-semibold">NIT Cliente</label>
                  <input type="text" value={recibo.clienteNit} onChange={e => updateField('clienteNit', e.target.value)} className="w-full border p-2 rounded text-sm" />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold">Concepto de Pago</label>
                <input type="text" value={recibo.concepto} onChange={e => updateField('concepto', e.target.value)} className="w-full border p-2 rounded text-sm" />
              </div>

              {/* LISTA PRODUCTOS */}
              <div className="space-y-2 pt-2">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-slate-500 uppercase">Productos / Ítems</h3>
                  <button onClick={addItem} className="px-2 py-1 bg-[#0c1b47] text-white text-xs font-bold rounded">
                    + Agregar Producto
                  </button>
                </div>
                {recibo.items.map(item => (
                  <div key={item.id} className="flex gap-2 items-center bg-slate-50 p-2 rounded border">
                    <input type="number" value={item.cantidad} onChange={e => updateItem(item.id, 'cantidad', parseFloat(e.target.value)||0)} className="w-14 border p-1 rounded text-center text-xs" />
                    <input type="text" value={item.descripcion} onChange={e => updateItem(item.id, 'descripcion', e.target.value)} className="flex-1 border p-1 rounded text-xs" />
                    <input type="number" step="0.5" value={item.precioUnitario} onChange={e => updateItem(item.id, 'precioUnitario', parseFloat(e.target.value)||0)} className="w-20 border p-1 rounded text-right text-xs" />
                    <button onClick={() => removeItem(item.id)} className="text-red-500 text-xs font-bold px-1">✕</button>
                  </div>
                ))}
              </div>

              {/* SECCIÓN PAGO EN EFECTIVO */}
              <div className="bg-[#0c1b47] text-white p-4 rounded-xl space-y-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-400">💵 Sección de Pago en Efectivo</h3>
                <div className="grid grid-cols-3 gap-3 text-center">
                  <div className="bg-slate-800 p-2 rounded">
                    <div className="text-[10px] text-slate-300">TOTAL</div>
                    <div className="text-base font-black">Q{totalPagar.toFixed(2)}</div>
                  </div>
                  <div className="bg-slate-800 p-2 rounded border border-emerald-500">
                    <div className="text-[10px] text-emerald-300">EFECTIVO RECIBIDO</div>
                    <input type="number" value={recibo.efectivoRecibido} onChange={e => updateField('efectivoRecibido', parseFloat(e.target.value)||0)} className="w-full bg-slate-900 text-emerald-400 font-bold text-center border-none focus:outline-none rounded py-1" />
                  </div>
                  <div className="bg-slate-800 p-2 rounded">
                    <div className="text-[10px] text-amber-300">CAMBIO</div>
                    <div className="text-base font-black text-emerald-400">Q{cambioEfectivo.toFixed(2)}</div>
                  </div>
                </div>
              </div>
            </div>

            {/* PREVISUALIZACIÓN VIVA DEL TICKET */}
            <div className="lg:col-span-5 bg-slate-200 p-4 rounded-2xl">
              <div className="text-center font-bold text-xs text-slate-600 mb-2">
                VISTA PREVIA DEL TICKET (72mm Útil / 80mm Rollo)
              </div>
              <div id="printable-receipt" ref={ticketRef} className="recibo-ticket-container">
                <div className="recibo-header">
                  <div className="recibo-company-title">{recibo.empresaNombre}</div>
                  <div className="text-[9px] font-bold text-slate-700">{recibo.empresaSubtítulo}</div>
                  <div className="text-[8.5px] text-slate-600">{recibo.direccion}</div>
                  <div className="text-[8.5px] text-slate-600 font-bold">Tel: {recibo.telefono}</div>
                  <div className="recibo-tag">RECIBO PROVISIONAL DE CAJA</div>
                </div>

                <div className="flex justify-between border bg-slate-50 p-1 rounded text-[9.5px] mb-2 font-bold">
                  <span>FOLIO: <span className="text-red-600">{recibo.folio}</span></span>
                  <span>FECHA: {recibo.fecha}</span>
                </div>

                <div className="text-[9.5px] space-y-0.5 border-b pb-1 mb-2">
                  <div><b>RECIBIMOS DE:</b> {recibo.clienteNombre}</div>
                  <div><b>NIT / CÓDIGO:</b> {recibo.clienteNit} | {recibo.clienteCodigo}</div>
                  <div><b>CONCEPTO:</b> <i>{recibo.concepto}</i></div>
                </div>

                <table className="recibo-table">
                  <thead>
                    <tr>
                      <th>CANT</th>
                      <th>DESCRIPCIÓN</th>
                      <th style={{textAlign: 'right'}}>TOTAL</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recibo.items.map(i => (
                      <tr key={i.id}>
                        <td style={{textAlign: 'center', fontWeight: 'bold'}}>{i.cantidad}</td>
                        <td>
                          <div className="font-bold">{i.descripcion}</div>
                          <div className="text-[8.5px] text-slate-500">Q{i.precioUnitario.toFixed(2)} c/u</div>
                        </td>
                        <td style={{textAlign: 'right', fontWeight: 'bold'}}>Q{(i.cantidad * i.precioUnitario).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="border-t border-dashed border-[#0c1b47] pt-1 mb-2 text-right">
                  <div className="text-xs font-black text-[#0c1b47]">TOTAL A PAGAR: Q{totalPagar.toFixed(2)}</div>
                </div>

                {/* APARTADO DESTACADO FONDO INVERTIDO #0c1b47 */}
                <div className="recibo-cash-section">
                  <div className="flex justify-between items-center border-b border-slate-600 pb-1 mb-1 font-bold text-[10px]">
                    <span>💵 PAGO EN EFECTIVO</span>
                    <span className="bg-emerald-500 px-1 rounded text-[8px]">CANCELADO</span>
                  </div>
                  <div className="recibo-cash-row">
                    <span>TOTAL RECIBO:</span>
                    <span className="font-bold">Q{totalPagar.toFixed(2)}</span>
                  </div>
                  <div className="recibo-cash-row">
                    <span>EFECTIVO RECIBIDO:</span>
                    <span className="font-bold">Q{recibo.efectivoRecibido.toFixed(2)}</span>
                  </div>
                  <div className="recibo-cash-row bg-white/20 p-1 rounded mt-1">
                    <span className="font-bold text-[10px]">CAMBIO / VUELTAS:</span>
                    <span className="font-black text-emerald-300 text-xs">Q{cambioEfectivo.toFixed(2)}</span>
                  </div>
                </div>

                <div className="recibo-signature-space"></div>
                <div className="text-[9px] text-center font-bold">(F) {recibo.cajeroNombre}</div>

                <div className="text-center mt-2 border-t pt-1 text-[8px] text-slate-600">
                  <div className="font-bold text-[#0c1b47] text-[9px]">¡GRACIAS POR SU COMPRA EN AGRICOBET!</div>
                  <i>Todo cheque rechazado tendrá recargo automático del 3%.</i>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('app')).render(<ReciboCajaApp />);
  </script>
</body>
</html>
