services:
  agricovet-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agricovet_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-agricovet_secret_key_2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres123@host.docker.internal:5432/agricovet_db}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/ventas-reporte}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_TEST_PHONE=${WHATSAPP_TEST_PHONE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./clients_local.json:/app/clients_local.json
      - ./client_visits_local.json:/app/client_visits_local.json
      - ./warehouse_config.json:/app/warehouse_config.json
      - ./folio_config.json:/app/folio_config.json
    networks:
      - agricovet-network

networks:
  agricovet-network:
    driver: bridge
